<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>RFID Smart System</title>
    <script>
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            '/RFID-Smart-System/' +
            l.pathname.split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body>
    <p>Redirecting...</p>
</body>

</html>
